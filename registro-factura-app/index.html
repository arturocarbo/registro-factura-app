<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Registro Factura SAP</title>
  
  <!-- Estilos con Tailwind CSS (CDN directo) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Manifest para PWA e iOS -->
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Facturas SAP" />
</head>
<body class="bg-slate-100 text-slate-900 font-sans min-h-screen flex flex-col">

  <!-- Encabezado -->
  <header class="bg-blue-700 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
    <h1 className="font-bold text-lg flex items-center gap-2">📄 Registro Factura</h1>
    <span class="text-xs bg-blue-800 px-2 py-1 rounded-full">SAP Ready</span>
  </header>

  <!-- Contenido Principal -->
  <main class="flex-1 max-w-md w-full mx-auto p-4 space-y-4">
    
    <!-- Zona para Capturar o Cargar Foto -->
    <div id="upload-box" onclick="document.getElementById('file-input').click()" 
         class="border-2 border-dashed border-blue-400 bg-white rounded-2xl p-8 text-center cursor-pointer hover:bg-blue-50 transition flex flex-col items-center justify-center min-h-[180px]">
      <span class="text-4xl mb-2">📸</span>
      <p class="font-bold text-slate-700">Tomar foto o subir factura</p>
      <p class="text-xs text-slate-500 mt-1">Presiona aquí para abrir la cámara</p>
      <input type="file" id="file-input" accept="image/*" capture="environment" class="hidden" onchange="procesarFoto(event)" />
    </div>

    <!-- Vista Previa e Indicador de Carga -->
    <div id="preview-card" class="hidden bg-white p-4 rounded-2xl border border-slate-200 space-y-3">
      <img id="img-preview" class="w-full max-h-56 object-contain rounded-xl bg-slate-900" src="" alt="Factura" />
      <div id="loading-spinner" class="text-center py-2 text-blue-600 font-semibold text-sm hidden">
        ✨ Analizando factura con IA Gemini...
      </div>
    </div>

    <!-- Formulario con Datos Extraídos -->
    <form id="expense-form" class="hidden bg-white p-5 rounded-2xl border border-slate-200 space-y-3" onsubmit="enviarCorreoSAP(event)">
      <h2 class="font-bold text-slate-800 text-sm border-b pb-2">Verificación de Datos</h2>
      
      <div>
        <label class="text-xs font-semibold text-slate-500">Establecimiento / Comercio</label>
        <input type="text" id="merchant" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg mt-1" />
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs font-semibold text-slate-500">Monto Total ($)</label>
          <input type="number" step="0.01" id="totalAmount" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg font-bold mt-1" />
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-500">IVA / Impuesto ($)</label>
          <input type="number" step="0.01" id="taxAmount" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg mt-1" />
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs font-semibold text-slate-500">Fecha</label>
          <input type="date" id="date" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg mt-1" />
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-500">Nº Factura</label>
          <input type="text" id="invoiceNumber" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg mt-1" />
        </div>
      </div>

      <div>
        <label class="text-xs font-semibold text-slate-500">Categoría</label>
        <select id="category" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg bg-white mt-1">
          <option value="Alimentación">Alimentación</option>
          <option value="Transporte">Transporte / Taxis</option>
          <option value="Combustible">Combustible</option>
          <option value="Hospedaje">Hospedaje</option>
          <option value="Otros">Otros</option>
        </select>
      </div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-md transition mt-2">
        ✉️ Enviar Registro por Correo a SAP
      </button>
    </form>

  </main>

  <!-- Lógica JavaScript Vanilla -->
  <script>
    // Registro del Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    let imagenBase64 = "";

    function procesarFoto(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('img-preview').src = e.target.result;
        imagenBase64 = e.target.result.split(',')[1];
        
        document.getElementById('preview-card').classList.remove('hidden');
        document.getElementById('loading-spinner').classList.remove('hidden');
        
        // Simulación o llamado a la IA de Gemini
        llamarGeminiAPI(imagenBase64, file.type);
      };
      reader.readAsDataURL(file);
    }

    async function llamarGeminiAPI(base64Data, mimeType) {
      // AQUÍ PUEDES PEGAR TU API KEY DE GOOGLE GEMINI
      const API_KEY = ""; 

      if (!API_KEY) {
        // Modo demostración automático si no hay API Key
        setTimeout(() => {
          completarFormulario({
            merchant: "Restaurante El Ejemplo",
            totalAmount: 45.50,
            taxAmount: 5.92,
            date: new Date().toISOString().split('T')[0],
            invoiceNumber: "FAC-2026-001",
            category: "Alimentación"
          });
        }, 1500);
        return;
      }

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: "Extrae los datos de la factura en formato JSON: merchant, totalAmount, taxAmount, date (YYYY-MM-DD), invoiceNumber, category" },
                { inlineData: { mimeType: mimeType, data: base64Data } }
              ]
            }]
          })
        });

        const data = await response.json();
        const textoRespuesta = data.candidates[0].content.parts[0].text;
        const jsonLimpio = JSON.parse(textoRespuesta.replace(/```json|```/g, ''));
        completarFormulario(jsonLimpio);
      } catch (err) {
        alert("No se pudo leer automáticamente la factura. Por favor, completa los campos manualmente.");
        document.getElementById('loading-spinner').classList.add('hidden');
        document.getElementById('expense-form').classList.remove('hidden');
      }
    }

    function completarFormulario(data) {
      document.getElementById('loading-spinner').classList.add('hidden');
      document.getElementById('expense-form').classList.remove('hidden');

      document.getElementById('merchant').value = data.merchant || '';
      document.getElementById('totalAmount').value = data.totalAmount || '';
      document.getElementById('taxAmount').value = data.taxAmount || '';
      document.getElementById('date').value = data.date || '';
      document.getElementById('invoiceNumber').value = data.invoiceNumber || '';
      document.getElementById('category').value = data.category || 'Otros';
    }

    function enviarCorreoSAP(e) {
      e.preventDefault();
      const correoDestino = "gastos-sap@tuempresa.com"; // Cambia este correo por el de tu empresa
      const merchant = document.getElementById('merchant').value;
      const total = document.getElementById('totalAmount').value;
      const date = document.getElementById('date').value;
      const invoice = document.getElementById('invoiceNumber').value;
      const category = document.getElementById('category').value;

      const asunto = encodeURIComponent(`[GASTO] Factura ${invoice} - ${merchant}`);
      const cuerpo = encodeURIComponent(`Detalle del gasto para registro en SAP:\n\n` +
        `• Comercio: ${merchant}\n` +
        `• Nº Factura: ${invoice}\n` +
        `• Fecha: ${date}\n` +
        `• Categoría: ${category}\n` +
        `• Monto Total: $${total}\n`
      );

      window.location.href = `mailto:${correoDestino}?subject=${asunto}&body=${cuerpo}`;
    }
  </script>
</body>
</html>
